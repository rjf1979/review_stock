<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>股市脉搏 · 遥测后台</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --ink: #17212b;
      --muted: #5b6672;
      --line: #dbe1e7;
      --accent: #1f6feb;
      --accent-ink: #ffffff;
      --danger: #b42318;
      --ok: #15803d;
      --radius: 8px;
      --shadow: 0 1px 2px rgba(18, 28, 42, .06);
      --focus: 0 0 0 3px rgba(31, 111, 235, .28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    .shell { width: min(1120px, 100%); margin: 0 auto; padding: 24px 20px 48px; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 16px 0 18px;
      border-bottom: 1px solid var(--line);
    }

    h1 { margin: 0; font-size: 1.25rem; font-weight: 650; letter-spacing: 0; }

    .login {
      width: min(420px, 100%);
      margin: 48px auto 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .login h1 { margin-bottom: 18px; }

    label { display: block; margin-bottom: 8px; font-size: .88rem; color: var(--muted); }

    input[type="password"] {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font: inherit;
    }

    input:focus-visible,
    button:focus-visible,
    summary:focus-visible {
      outline: none;
      box-shadow: var(--focus);
      border-color: var(--accent);
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.05); }
    button:disabled { cursor: wait; opacity: .72; }

    button.secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
      font-weight: 500;
    }

    .login button { width: 100%; margin-top: 14px; }

    .status { min-height: 24px; margin: 16px 0 0; color: var(--muted); font-size: .9rem; }
    .status.error { color: var(--danger); }
    .login .status { margin-top: 14px; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .metric {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .metric small { display: block; color: var(--muted); font-size: .82rem; }
    .metric strong { display: block; margin-top: 6px; font-size: 1.8rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .metric.danger strong { color: var(--danger); }

    section {
      margin-top: 24px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    h2 { margin: 0 0 14px; font-size: 1rem; font-weight: 650; }

    .distribution { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .distribution h3 { margin: 0 0 8px; font-size: .9rem; color: var(--muted); font-weight: 600; }
    .distribution ul { margin: 0; padding: 0; list-style: none; }
    .distribution li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    .distribution li:last-child { border-bottom: 0; }

    .muted { color: var(--muted); }
    .empty { padding: 28px 12px; text-align: center; color: var(--muted); }

    .error-list { margin: 0; padding: 0; list-style: none; }
    .error-list li { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .error-list li:last-child { border-bottom: 0; }

    .error-meta { display: flex; gap: 8px 14px; flex-wrap: wrap; color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
    .error-message { margin: 8px 0 0; color: var(--ink); overflow-wrap: anywhere; }

    details { margin-top: 8px; }
    summary { display: inline-block; min-height: 32px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--accent); cursor: pointer; font-size: .85rem; user-select: none; }

    pre {
      margin: 8px 0 0;
      padding: 12px;
      background: #0f172a;
      color: #e6edf3;
      border-radius: var(--radius);
      overflow-x: auto;
      font-size: .82rem;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 820px) {
      .distribution { grid-template-columns: 1fr; }
    }

    /* 行情同步板块 */
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 14px; }
    .section-head h2 { margin: 0; }
    .pill { display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px; border-radius: 999px; font-size: .8rem; font-weight: 600; }
    .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .pill.fresh { background: rgba(21, 128, 61, .12); color: var(--ok); }
    .pill.stale { background: rgba(180, 35, 24, .12); color: var(--danger); }
    .pill.idle { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
    .market-meta { display: flex; gap: 8px 18px; flex-wrap: wrap; color: var(--muted); font-size: .84rem; font-variant-numeric: tabular-nums; margin: 0 0 14px; }
    .market-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .market-grid .metric strong { font-size: 1.3rem; }
    .market-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 16px; }
    .market-cols h3 { margin: 0 0 8px; font-size: .88rem; color: var(--muted); font-weight: 600; }
    .market-table { width: 100%; border-collapse: collapse; font-size: .86rem; font-variant-numeric: tabular-nums; }
    .market-table th { padding: 6px 8px; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 600; text-align: right; white-space: nowrap; }
    .market-table td { padding: 7px 8px; border-bottom: 1px solid var(--bg); text-align: right; }
    .market-table th:first-child, .market-table td:first-child { text-align: left; }
    .market-table td:first-child { font-weight: 600; }
    .up { color: var(--danger); }
    .down { color: var(--ok); }

    @media (max-width: 600px) {
      .shell { padding: 16px 12px 32px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .topbar button { width: 100%; }
      .metrics { grid-template-columns: 1fr 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0s !important;
        animation-duration: 0s !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section id="login" class="login" aria-labelledby="login-title">
      <h1 id="login-title">股市脉搏 · 遥测后台</h1>
      <label for="admin-key">查看密钥</label>
      <input id="admin-key" type="password" autocomplete="current-password" placeholder="输入 TELEMETRY_ADMIN_KEY">
      <button id="login-btn" type="button">登录</button>
      <p id="login-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <div id="dashboard" hidden>
      <header class="topbar">
        <h1>股市脉搏 · 遥测后台</h1>
        <button id="logout-btn" class="secondary" type="button">退出</button>
      </header>

      <p id="status" class="status" role="status" aria-live="polite">正在加载数据…</p>

      <div class="metrics" aria-label="概览">
        <div class="metric"><small>安装用户</small><strong id="metric-installs">0</strong></div>
        <div class="metric"><small>安装事件</small><strong id="metric-install-events">0</strong></div>
        <div class="metric"><small>公网 IP</small><strong id="metric-ips">0</strong></div>
        <div class="metric"><small>启动事件</small><strong id="metric-startups">0</strong></div>
        <div class="metric"><small>关闭事件</small><strong id="metric-closes">0</strong></div>
        <div class="metric danger"><small>错误事件</small><strong id="metric-errors">0</strong></div>
        <div class="metric"><small>总事件</small><strong id="metric-total">0</strong></div>
      </div>

      <section aria-labelledby="distribution-title">
        <h2 id="distribution-title">分布</h2>
        <div class="distribution">
          <div><h3>版本</h3><ul id="by-version"></ul></div>
          <div><h3>架构</h3><ul id="by-arch"></ul></div>
          <div><h3>系统</h3><ul id="by-os"></ul></div>
        </div>
      </section>

      <section aria-labelledby="errors-title">
        <h2 id="errors-title">最近错误</h2>
        <ul id="error-list" class="error-list"></ul>
      </section>

      <section aria-labelledby="market-title">
        <div class="section-head">
          <h2 id="market-title">行情同步</h2>
          <button id="market-refresh" class="secondary" type="button">刷新</button>
        </div>
        <div class="market-meta" id="market-meta" hidden>
          <span id="market-pill-wrap"><span id="market-pill" class="pill idle"><i></i><span id="market-pill-text">检查中</span></span></span>
          <span id="market-updated"></span>
          <span id="market-version"></span>
          <span id="market-asof"></span>
        </div>
        <p id="market-status" class="status" role="status" aria-live="polite">正在加载行情同步状态…</p>
        <div id="market-content"></div>
      </section>
    </div>
  </div>

  <script>
    const loginView = document.getElementById('login');
    const dashboardView = document.getElementById('dashboard');
    const loginStatus = document.getElementById('login-status');
    const status = document.getElementById('status');
    const keyInput = document.getElementById('admin-key');
    const loginButton = document.getElementById('login-btn');
    const logoutButton = document.getElementById('logout-btn');

    function setLoginStatus(text, isError = false) {
      loginStatus.textContent = text;
      loginStatus.classList.toggle('error', isError);
    }

    function setStatus(text, isError = false) {
      status.textContent = text;
      status.classList.toggle('error', isError);
    }

    function showLogin() {
      dashboardView.hidden = true;
      loginView.hidden = false;
      stopMarketTimer();
    }

    function showDashboard() {
      loginView.hidden = true;
      dashboardView.hidden = false;
      keyInput.value = '';
      load();
      loadMarket();
      startMarketTimer();
    }

    function number(value) {
      return Number(value || 0).toLocaleString('zh-CN');
    }

    function renderList(target, values) {
      target.replaceChildren();
      const entries = Object.entries(values || {}).sort((a, b) => b[1] - a[1]);
      if (!entries.length) {
        const empty = document.createElement('li');
        empty.className = 'muted';
        empty.textContent = '暂无数据';
        target.append(empty);
        return;
      }
      for (const [label, value] of entries) {
        const item = document.createElement('li');
        const name = document.createElement('span');
        name.textContent = label;
        const count = document.createElement('span');
        count.textContent = number(value);
        item.append(name, count);
        target.append(item);
      }
    }

    function shortId(value) {
      return value ? String(value).slice(0, 8) : '未知';
    }

    function renderErrors(errors) {
      const target = document.getElementById('error-list');
      target.replaceChildren();
      if (!errors?.length) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = '暂无错误记录';
        target.append(empty);
        return;
      }
      for (const error of errors) {
        const item = document.createElement('li');
        const meta = document.createElement('div');
        meta.className = 'error-meta';
        const parts = [
          error.timestamp ? new Date(error.timestamp).toLocaleString('zh-CN', { hour12: false }) : '时间未知',
          `v${error.appVersion || '-'}`,
          error.arch || '-',
          error.source || '-',
          error.ip || 'IP 未知',
          `#${shortId(error.installId)}`,
        ];
        for (const part of parts) {
          const span = document.createElement('span');
          span.textContent = part;
          meta.append(span);
        }
        const message = document.createElement('p');
        message.className = 'error-message';
        message.textContent = error.message || '未知错误';
        item.append(meta, message);
        if (error.stack) {
          const details = document.createElement('details');
          const summary = document.createElement('summary');
          summary.textContent = '查看堆栈';
          const pre = document.createElement('pre');
          pre.textContent = error.stack;
          details.append(summary, pre);
          item.append(details);
        }
        target.append(item);
      }
    }

    // ── 行情同步 ──
    const MARKET_REFRESH_MS = 60000;
    let marketTimer = null;

    function bjTime(value) {
      if (!value) return '—';
      const d = new Date(value);
      return Number.isNaN(d.getTime()) ? '—' : d.toLocaleString('zh-CN', { hour12: false });
    }

    function toneClass(value) {
      const n = Number(value);
      if (!Number.isFinite(n) || n === 0) return '';
      return n > 0 ? 'up' : 'down';
    }

    function fmtPct(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return '—';
      return (n > 0 ? '+' : '') + n.toFixed(2) + '%';
    }

    function fmtAmount(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n.toFixed(2) + ' 亿' : '—';
    }

    function marketCell(label, valueHtml) {
      const cell = document.createElement('div');
      cell.className = 'metric';
      const small = document.createElement('small');
      small.textContent = label;
      const strong = document.createElement('strong');
      strong.innerHTML = valueHtml;
      cell.append(small, strong);
      return cell;
    }

    function marketTable(headers, rows) {
      const table = document.createElement('table');
      table.className = 'market-table';
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      for (const header of headers) {
        const th = document.createElement('th');
        th.textContent = header;
        headRow.append(th);
      }
      thead.append(headRow);
      const tbody = document.createElement('tbody');
      for (const cells of rows) {
        const tr = document.createElement('tr');
        cells.forEach((cell, index) => {
          const td = document.createElement('td');
          if (typeof cell === 'object') {
            td.textContent = cell.text;
            if (cell.className) td.className = cell.className;
          } else {
            td.textContent = cell;
          }
          tr.append(td);
        });
        tbody.append(tr);
      }
      table.append(thead, tbody);
      return table;
    }

    function renderMarket(status, realtime) {
      const meta = document.getElementById('market-meta');
      const content = document.getElementById('market-content');
      const marketStatus = document.getElementById('market-status');
      meta.hidden = false;

      const pill = document.getElementById('market-pill');
      let pillText = '等待上传';
      let pillClass = 'idle';
      if (realtime) {
        if (realtime.status === 'stale') { pillText = '数据已过期'; pillClass = 'stale'; }
        else { pillText = '实时同步中'; pillClass = 'fresh'; }
      } else if (status) {
        pillText = '等待桌面版上传';
      } else {
        pillText = '云端不可达';
        pillClass = 'stale';
      }
      pill.className = 'pill ' + pillClass;
      document.getElementById('market-pill-text').textContent = pillText;

      document.getElementById('market-updated').textContent = '数据时间 ' + bjTime(realtime?.updatedAt);
      document.getElementById('market-version').textContent = status?.version ? '桌面版 v' + status.version : '';
      document.getElementById('market-asof').textContent = realtime?.asOfDate ? '行情日期 ' + realtime.asOfDate : '';

      content.replaceChildren();
      const indices = Array.isArray(realtime?.indices) ? realtime.indices.slice(0, 8) : [];
      if (!indices.length) {
        marketStatus.textContent = '云端已连接，但还没有可展示的实时行情。桌面版会在交易时段自动上传；非交易时段请留意下一个交易日。';
        marketStatus.classList.remove('error');
        return;
      }
      marketStatus.textContent = '';

      const grid = document.createElement('div');
      grid.className = 'market-grid';
      for (const item of indices) {
        grid.append(marketCell(item.name, `<span class="${toneClass(item.changePct)}">${item.close ?? '—'}</span>`));
      }
      content.append(grid);

      const breadth = realtime?.breadth;
      if (breadth && (breadth.up != null || breadth.limitUp != null)) {
        const breadthGrid = document.createElement('div');
        breadthGrid.className = 'market-grid';
        breadthGrid.style.marginTop = '10px';
        breadthGrid.append(
          marketCell('上涨 / 下跌', `${breadth.up ?? '—'} / <span class="down">${breadth.down ?? '—'}</span>`),
          marketCell('红盘率', breadth.redRatio != null ? breadth.redRatio + '%' : '—'),
          marketCell('涨停 / 跌停', `<span class="up">${breadth.limitUp ?? '—'}</span> / <span class="down">${breadth.limitDown ?? '—'}</span>`),
          marketCell('两市成交', breadth.turnoverYi != null ? fmtAmount(breadth.turnoverYi) : '—'),
        );
        content.append(breadthGrid);
      }

      const limitUp = Array.isArray(realtime?.limitUpStocks) ? realtime.limitUpStocks.slice(0, 10) : [];
      const inflow = Array.isArray(realtime?.fundFlow) ? realtime.fundFlow.slice(0, 8) : [];
      const outflow = Array.isArray(realtime?.outflow) ? realtime.outflow.slice(0, 8) : [];
      if (limitUp.length || inflow.length || outflow.length) {
        const cols = document.createElement('div');
        cols.className = 'market-cols';
        if (limitUp.length) {
          const block = document.createElement('div');
          const title = document.createElement('h3');
          title.textContent = '涨停梯队（前 10）';
          block.append(title, marketTable(['股票', '连板', '涨跌幅', '行业'], limitUp.map(s => [
            s.name || s.code, s.streak || 1, { text: fmtPct(s.changePct), className: 'up' }, s.sector || '—',
          ])));
          cols.append(block);
        }
        if (inflow.length || outflow.length) {
          const block = document.createElement('div');
          const title = document.createElement('h3');
          title.textContent = '板块主力资金（净流入 / 净流出）';
          block.append(title, marketTable(
            ['板块', '涨跌幅', '主力净流入'],
            [...inflow.map(s => [s.name, { text: fmtPct(s.changePct), className: toneClass(s.changePct) }, { text: fmtAmount(s.inflowYi), className: 'up' }]),
             ...outflow.map(s => [s.name, { text: fmtPct(s.changePct), className: toneClass(s.changePct) }, { text: fmtAmount(s.inflowYi), className: 'down' }])],
          ));
          cols.append(block);
        }
        content.append(cols);
      }
    }

    async function loadMarket({ silent = false } = {}) {
      const marketStatus = document.getElementById('market-status');
      marketStatus.classList.remove('error');
      if (!silent) marketStatus.textContent = '正在加载行情同步状态…';
      try {
        const [statusRes, realtimeRes] = await Promise.all([
          fetch('/api/market/status'),
          fetch('/api/market/realtime'),
        ]);
        if (statusRes.status === 401 || realtimeRes.status === 401) {
          stopMarketTimer();
          showLogin();
          return;
        }
        const status = statusRes.ok ? await statusRes.json() : null;
        const realtime = realtimeRes.ok ? await realtimeRes.json() : null;
        renderMarket(status, realtime && !realtime.error ? realtime : null);
        if (!statusRes.ok && !realtimeRes.ok) {
          marketStatus.textContent = '暂时连不上行情数据服务，稍后自动重试。';
          marketStatus.classList.add('error');
        }
      } catch {
        marketStatus.textContent = '行情同步状态加载失败，稍后自动重试。';
        marketStatus.classList.add('error');
      }
    }

    function startMarketTimer() {
      if (marketTimer) return;
      marketTimer = setInterval(() => {
        if (!document.hidden && !dashboardView.hidden) loadMarket({ silent: true });
      }, MARKET_REFRESH_MS);
    }

    function stopMarketTimer() {
      if (marketTimer) { clearInterval(marketTimer); marketTimer = null; }
    }

    document.getElementById('market-refresh').addEventListener('click', () => loadMarket());

    async function load() {
      setStatus('正在加载数据…');
      try {
        const [summaryResponse, errorsResponse] = await Promise.all([
          fetch('/api/telemetry/summary'),
          fetch('/api/telemetry/errors?limit=100'),
        ]);
        if (summaryResponse.status === 401 || errorsResponse.status === 401) {
          showLogin();
          return;
        }
        if (summaryResponse.status === 503 || errorsResponse.status === 503) {
          throw new Error('服务端尚未配置 TELEMETRY_ADMIN_KEY。');
        }
        if (!summaryResponse.ok || !errorsResponse.ok) throw new Error('数据加载失败，请稍后重试。');
        const summary = await summaryResponse.json();
        const errorData = await errorsResponse.json();
        document.getElementById('metric-installs').textContent = number(summary.installs);
        document.getElementById('metric-install-events').textContent = number(summary.installEvents);
        document.getElementById('metric-ips').textContent = number(summary.uniqueIps);
        document.getElementById('metric-startups').textContent = number(summary.startupEvents);
        document.getElementById('metric-closes').textContent = number(summary.closeEvents);
        document.getElementById('metric-errors').textContent = number(summary.errorEvents);
        document.getElementById('metric-total').textContent = number(summary.totalEvents);
        renderList(document.getElementById('by-version'), summary.byVersion);
        renderList(document.getElementById('by-arch'), summary.byArch);
        renderList(document.getElementById('by-os'), summary.byOsVersion);
        renderErrors(errorData.errors);
        setStatus(`已更新，共 ${number(summary.installs)} 位安装用户。`);
      } catch (error) {
        setStatus(error.message || '加载失败。', true);
      }
    }

    async function login() {
      const key = keyInput.value.trim();
      if (!key) {
        setLoginStatus('请输入查看密钥。', true);
        return;
      }
      loginButton.disabled = true;
      setLoginStatus('正在登录…');
      try {
        const response = await fetch('/api/telemetry/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key }),
        });
        if (response.status === 401) throw new Error('密钥不正确。');
        if (response.status === 503) throw new Error('服务端尚未配置 TELEMETRY_ADMIN_KEY。');
        if (!response.ok) throw new Error('登录失败，请稍后重试。');
        showDashboard();
      } catch (error) {
        setLoginStatus(error.message || '登录失败。', true);
      } finally {
        loginButton.disabled = false;
      }
    }

    async function logout() {
      try {
        await fetch('/api/telemetry/logout', { method: 'POST' });
      } finally {
        showLogin();
      }
    }

    loginButton.addEventListener('click', login);
    logoutButton.addEventListener('click', logout);
    keyInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') login();
    });

    (async () => {
      const response = await fetch('/api/telemetry/summary').catch(() => null);
      if (response?.ok) showDashboard();
      else showLogin();
    })();
  </script>
</body>
</html>
